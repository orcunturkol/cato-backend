# Temporary: cap Docker's json-file logs until these services move to ECS with
# CloudWatch Logs. Uncapped, cato-api's log reached 62 GB and filled the disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "100m"
    max-file: "5"

# One image, three roles (Hosting/CatoRole.cs), as the ECS tasks will run it: migrate applies
# the EF migrations and exits, api serves HTTP only, worker runs every hosted service
# (watchers, queue consumers, job dispatcher, alerts, SteamKit). Exactly one worker: it is
# one Steam login, and the Steam throttles are per process.
x-cato-backend: &cato-backend
  build:
    context: .
    dockerfile: Dockerfile
  image: cato-backend:local
  logging: *default-logging

x-cato-env: &cato-env
  ASPNETCORE_ENVIRONMENT: Production
  ConnectionStrings__DefaultConnection: "Host=${RDS_HOST:-postgres};Port=${RDS_PORT:-5432};Database=cato;Username=cato_user;Password=${RDS_DB_PASSWORD:-cato_dev_password}"
  RabbitMQ__HostName: rabbitmq
  RabbitMQ__Port: "5672"
  RabbitMQ__UserName: cato_user
  RabbitMQ__Password: cato_dev_password
  Redis__ConnectionString: "redis:6379"
  Redis__InstanceName: "cato"
  SteamWebApi__ApiKey: "${STEAM_WEB_API_KEY:-}"
  # Alerts stay off unless .env sets ALERTS_ENABLED=true (the server). SNS, Secrets
  # Manager and CloudWatch use the EC2 instance role (infra/phase1). The worker runs the
  # monitor and the heartbeat; the api sends POST /api/alerts/test.
  Alerts__Enabled: "${ALERTS_ENABLED:-false}"
  Alerts__HeartbeatEnabled: "${ALERTS_ENABLED:-false}"
  Alerts__SnsTopicArn: "${ALERTS_SNS_TOPIC_ARN:-}"
  Alerts__DiscordWebhookSecretId: "${ALERTS_DISCORD_SECRET_ID:-}"
  # Secrets Manager when .env sets SECRETS_BACKEND=aws (the server), else files inside the container.
  Secrets__Backend: "${SECRETS_BACKEND:-file}"
  # Structured logs also go to the Seq container; without this line a process logs to the console only.
  Seq__ServerUrl: "http://seq:80"

services:
  # ── CATO migrations (one-shot; api and worker start after it exits 0) ──
  migrate:
    <<: *cato-backend
    container_name: cato-migrate
    restart: "no"
    environment:
      <<: *cato-env
      CATO_ROLE: migrate

  # ── CATO API (HTTP only) ──
  api:
    <<: *cato-backend
    container_name: cato-api
    restart: unless-stopped
    stop_grace_period: 45s
    # Cap each process so a memory leak kills its own container (which auto-restarts)
    # instead of the whole host. Inside a limited container the .NET GC defaults its heap
    # hard limit to 75% of the cgroup limit. memswap_limit == mem_limit forbids host swap.
    mem_limit: 1536m
    memswap_limit: 1536m
    ports:
      # Loopback only: the collector's jobs and agents call localhost:5039. People reach the
      # API through Caddy (https://catoptricgames.duckdns.org/api), which asks for the admin
      # password on write actions; a tailnet port here would go around that.
      - "127.0.0.1:5039:8080"
    environment:
      <<: *cato-env
      CATO_ROLE: api
      # Store enrichment runs in the worker (RemoteGameEnrichmentGateway, 90 s).
      Worker__BaseUrl: "http://worker:8080/"
      # People open the site at this origin; the frontend there calls the same origin anyway.
      Cors__AllowedOrigins__0: "https://catoptricgames.duckdns.org"
      # /swagger stays on the private server, as it was in Development.
      Swagger__Enabled: "true"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      seq:
        condition: service_started

  # ── CATO worker (hosted services; no published port, the api calls http://worker:8080) ──
  worker:
    <<: *cato-backend
    container_name: cato-worker
    restart: unless-stopped
    # The .NET host gives its services up to 30 s to stop; Docker's default of 10 s killed
    # it first, so watcher cycles cut by a deploy stayed "Running" (shown as Lost)
    # instead of being stored as Interrupted.
    stop_grace_period: 45s
    mem_limit: 3g
    memswap_limit: 3g
    environment:
      <<: *cato-env
      CATO_ROLE: worker
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      seq:
        condition: service_started

  # ── Redis ──
  redis:
    image: redis:7-alpine
    container_name: cato-redis
    logging: *default-logging
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
      - "${TAILSCALE_IP}:6379:6379"
    volumes:
      - cato_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── RabbitMQ ──
  # No log cap here on purpose: there is no fixed hostname, so a re-create gives
  # RabbitMQ a new node name and its queue data looks lost. Add hostname first.
  rabbitmq:
    image: rabbitmq:3-management
    container_name: cato-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: cato_user
      RABBITMQ_DEFAULT_PASS: cato_dev_password
    ports:
      - "${TAILSCALE_IP}:5672:5672"
      - "127.0.0.1:5672:5672"
      - "${TAILSCALE_IP}:15672:15672"
      - "127.0.0.1:15672:15672"
    volumes:
      - cato_rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5

  # ── Seq (structured log search + alerting) ──
  # UI + ingestion on the same listener (container port 80). Browse logs and
  # configure failure alerts (Signals -> webhook) at http://<host>:5341.
  seq:
    image: datalust/seq:latest
    container_name: cato-seq
    logging: *default-logging
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
    ports:
      - "127.0.0.1:5341:80"
      - "${TAILSCALE_IP}:5341:80"
      # The ECS tasks log here through seq.cato.internal until Step D3 moves Seq to the edge
      # node; the host's security group opens 5341 only to the ECS groups (infra/phase2).
      - "${HOST_PRIVATE_IP:-127.0.0.1}:5341:80"
    # SEQ_FIRSTRUN_ADMINPASSWORD (used only when the store is new; username "admin").
    # Secrets come from Secrets Manager (cato/server/compose-env) through a file in memory,
    # written at boot by cato-compose-secrets.service (infra/phase1/systemd).
    env_file:
      - path: /run/cato/seq.env
        required: false
    volumes:
      - cato_seq:/data

  # ── Frontend ──
  frontend:
    build:
      context: ../cato-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-https://catoptricgames.duckdns.org/api}
    container_name: cato-frontend
    logging: *default-logging
    ports:
      - "${TAILSCALE_IP}:5173:80"
    restart: unless-stopped

  # ── OGT API (game voting; talks to the CATO API over HTTP, never its db) ──
  ogt-api:
    build:
      context: ../ogt-backend
      dockerfile: Dockerfile
    container_name: ogt-api
    logging: *default-logging
    restart: unless-stopped
    mem_limit: 1g
    memswap_limit: 1g
    ports:
      - "127.0.0.1:5139:8080"
      - "${TAILSCALE_IP}:5139:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Cato__BaseUrl: "http://api:8080"
      Serilog__WriteTo__1__Args__serverUrl: "http://seq:80"
    # ConnectionStrings__DefaultConnection (same RDS server as CATO, database "ogt", role
    # "ogt") and Auth__InviteCode (needed to register; empty means nobody can register).
    # Secrets come from Secrets Manager (cato/server/compose-env) through a file in memory,
    # written at boot by cato-compose-secrets.service (infra/phase1/systemd).
    env_file:
      - path: /run/cato/ogt-api.env
        required: false
    volumes:
      # Persist ASP.NET data-protection keys so auth cookies survive restarts.
      - ogt_dpkeys:/root/.aspnet/DataProtection-Keys
    depends_on:
      api:
        condition: service_started
      seq:
        condition: service_started

  # ── OGT Frontend ──
  ogt-frontend:
    build:
      context: ../ogt-frontend
      dockerfile: Dockerfile
      # Empty VITE_API_URL = same-origin relative /api calls, routed by Caddy.
      args:
        VITE_API_URL: ${OGT_VITE_API_URL:-}
    container_name: ogt-frontend
    logging: *default-logging
    restart: unless-stopped
    ports:
      - "${TAILSCALE_IP}:5174:80"

  # ── Caddy reverse proxy (HTTPS for catoptricgames.duckdns.org via DuckDNS DNS-01) ──
  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    container_name: cato-caddy
    logging: *default-logging
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ports:
      - "${TAILSCALE_IP}:443:443"
    # DUCKDNS_TOKEN (DNS-01 certificate challenge).
    # Secrets come from Secrets Manager (cato/server/compose-env) through a file in memory,
    # written at boot by cato-compose-secrets.service (infra/phase1/systemd).
    env_file:
      - path: /run/cato/caddy.env
        required: false
    environment:
      ACME_EMAIL: ${ACME_EMAIL:-ofturkol@proton.me}
      # Write-action password (Caddyfile). The default is the hash of a random string nobody
      # kept: writes stay locked until scripts/set-admin-password.sh sets CATO_ADMIN_HASH.
      CATO_ADMIN_HASH: ${CATO_ADMIN_HASH:-JDJhJDE0JDVnQkpvR2svVHhWL09yQ2Zjc3piMHV3TUdLS1dGTVc5d2JvZkpuSlVmdHRXVmNLNmFST0cy}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - cato_caddy_data:/data
      - cato_caddy_config:/config
    # No depends_on: since Step A the upstreams run on ECS, and `up -d caddy` must never start
    # the old api/worker again (a second worker is a second Steam login and dispatcher).

  # ── EF Migration Helper (run with: docker compose run --rm ef-migration) ──
  ef-migration:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    working_dir: /src
    volumes:
      - .:/src
    entrypoint: ["bash", "/src/generate-migration.sh"]
    profiles:
      - tools

volumes:
  ogt_dpkeys:
  cato_rabbitmq:
  cato_redis:
  cato_caddy_data:
  cato_caddy_config:
  cato_seq:
